[package]
name = "pronunciation-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pronunciation_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = { version = "0.21", default-features = false }
thiserror = "1.0"
log = "0.4"
