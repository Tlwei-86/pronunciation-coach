name: Android CI & Artifact Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Core for Android (arm64-v8a & x86_64)
        working-directory: pronunciation-core
        run: |
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android-app/app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -t x86_64 -o ../android-app/app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK & Run Unit Tests
        working-directory: android-app
        run: |
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pronunciation-coach-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
