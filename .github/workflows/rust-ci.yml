name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        working-directory: pronunciation-core
        run: cargo fmt --check

      - name: Clippy Lint
        working-directory: pronunciation-core
        run: cargo clippy -- -D warnings

      - name: Cargo Test
        working-directory: pronunciation-core
        run: cargo test --verbose
